
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Search Engine</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <h1>Distributed Search Engine</h1>
        <p>Intelligent Information Retrieval using BM25 and PageRank</p>
    </header>

    <main>
        <form id="search-form">
            <input
                type="text"
                id="query"
                placeholder="Search documents..."
                autocomplete="off"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="status"></p>
        <section id="results"></section>
    </main>

    <footer>
        <p>Node 4 | Search Service and User Interface</p>
    </footer>

    <script>
        const form = document.getElementById("search-form");
        const queryInput = document.getElementById("query");
        const resultsContainer = document.getElementById("results");
        const statusText = document.getElementById("status");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const query = queryInput.value.trim();

            if (!query) return;

            resultsContainer.innerHTML = "";
            statusText.textContent = "Searching...";

            try {
                const response = await fetch(
                    `/search?q=${encodeURIComponent(query)}`
                );

                if (!response.ok) {
                    throw new Error("Search request failed");
                }

                const data = await response.json();

                statusText.textContent =
                    `${data.total_results} results found for "${data.query}"`;

                if (data.results.length === 0) {
                    resultsContainer.innerHTML =
                        "<p class='empty'>No matching documents found.</p>";
                    return;
                }

                data.results.forEach((doc, index) => {
                    const card = document.createElement("article");
                    card.className = "result-card";

                    const title = document.createElement("h2");
                    title.textContent = `${index + 1}. ${doc.title}`;

                    const link = document.createElement("a");
                    link.href = doc.url;
                    link.textContent = doc.url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";

                    const content = document.createElement("p");
                    content.textContent = doc.content;

                    const scores = document.createElement("p");
                    scores.className = "scores";
                    scores.textContent =
                        `BM25: ${doc.bm25_score.toFixed(4)} | ` +
                        `PageRank: ${doc.pagerank} | ` +
                        `Final Score: ${doc.final_score.toFixed(4)}`;

                    card.append(title, link, content, scores);
                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                statusText.textContent = "Unable to perform search.";
                console.error(error);
            }
        });
    </script>

</body>
</html>
